<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FL Launches">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="launch-icon.png">
<title>Florida Space Launches</title>
<style>
:root{color-scheme:dark;--bg:#171717;--panel:#1d1d1f;--line:#333;--muted:#b9b9bd}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.hero{padding:calc(24px + env(safe-area-inset-top)) 18px 24px;text-align:center;background:#1b1b1c;border-radius:0 0 18px 18px}
.kicker{font-size:15px;color:#bdbdc2;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:30px;margin:7px 0 22px;font-weight:500}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.num{font-size:42px;font-weight:700;line-height:1}.unit{margin-top:9px;color:#bdbdc2;font-size:13px;letter-spacing:.09em}
.bar{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 9px}.bar h2{margin:0;font-size:21px}.refresh{font-size:14px;color:#aaa}
.card{display:grid;grid-template-columns:112px 1fr 22px;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.pic{width:112px;height:166px;object-fit:cover;background:#29292b;border-radius:2px}.name{font-size:25px;line-height:1.08;margin:4px 0 13px}.date,.status,.meta{font-size:18px;line-height:1.4}.status{margin:5px 0 13px}.go{color:#8ee39b}.tbd{color:#ffd479}.meta{color:#f2f2f3}.loc{color:#d1d1d4}.watch{display:inline-flex;align-items:center;gap:7px;margin-top:12px;padding:9px 13px;border-radius:9px;background:#fff;color:#111;text-decoration:none;font-size:15px;font-weight:700}.watch:active{opacity:.72}.liveDot{width:8px;height:8px;border-radius:50%;background:#e53935;display:inline-block}.arrow{align-self:center;font-size:40px;color:#626267}.empty,.error{padding:30px 20px;text-align:center;color:#bbb}.error{color:#ffb4b4}
@media(max-width:430px){.hero h1{font-size:25px}.num{font-size:34px}.card{grid-template-columns:94px 1fr 18px;gap:12px}.pic{width:94px;height:150px}.name{font-size:22px}.date,.status,.meta{font-size:16px}}
</style>
</head>
<body>
<main class="app">
<section class="hero">
<div class="kicker">Next Florida Launch</div>
<h1 id="nextName">Loading launches…</h1>
<div class="countdown">
<div><div class="num" id="days">--</div><div class="unit">DAYS</div></div>
<div><div class="num" id="hours">--</div><div class="unit">HRS</div></div>
<div><div class="num" id="mins">--</div><div class="unit">MINS</div></div>
<div><div class="num" id="secs">--</div><div class="unit">SECS</div></div>
</div>
</section>
<div class="bar"><h2>Upcoming Launches</h2><span class="refresh" id="updated"></span></div>
<section id="list"><div class="empty">Loading Cape Canaveral & Kennedy Space Center launches…</div></section>
</main>
<script>
const API='https://ll.thespacedevs.com/2.3.0/launches/upcoming/?format=json&limit=100&ordering=net&mode=normal';
let launches=[], timer;
const $=id=>document.getElementById(id);
const florida=l=>{
 const s=((l.pad?.location?.name||'')+' '+(l.pad?.name||'')).toLowerCase();
 return s.includes('kennedy')||s.includes('cape canaveral');
};
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtDate(v){
 if(!v)return 'DATE/TIME TBD';
 return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit',timeZone:'America/New_York',timeZoneName:'short'}).format(new Date(v)).replace(',',' •');
}
function status(l){
 const n=(l.status?.name||'').toUpperCase();
 if(n.includes('GO')) return ['GO FOR LAUNCH','go'];
 if(n.includes('TBD')||n.includes('TBC')) return [n,'tbd'];
 return [n||'SCHEDULED',''];
}
function imageFor(l){return l.image?.image_url||l.image||l.rocket?.configuration?.image?.image_url||''}
function render(){
 const box=$('list');
 if(!launches.length){box.innerHTML='<div class="empty">No upcoming Florida launches found.</div>';return}
 box.innerHTML=launches.map(l=>{
  const st=status(l), img=imageFor(l), agency=l.launch_service_provider?.name||'Launch Provider';
  const rocket=l.rocket?.configuration?.full_name||l.rocket?.configuration?.name||'Rocket TBD';
  const loc=l.pad?.location?.name||'Florida Space Coast';
  const video=(l.vidURLs&&l.vidURLs.length?l.vidURLs[0]?.url:null)||(l.vid_urls&&l.vid_urls.length?l.vid_urls[0]:null)||l.webcast_live;
  const provider=(agency||'').toLowerCase();
  const fallback=provider.includes('spacex')?'https://www.spacex.com/launches/':
    provider.includes('united launch alliance')||provider.includes('ula')?'https://www.youtube.com/@ulalaunch':
    provider.includes('blue origin')?'https://www.blueorigin.com/live':
    provider.includes('nasa')?'https://www.youtube.com/@NASA':
    'https://www.youtube.com/results?search_query='+encodeURIComponent(agency+' '+l.name+' launch live');
  return `<article class="card">
   ${img?`<img class="pic" src="${esc(img)}" alt="">`:`<div class="pic"></div>`}
   <div><div class="name">${esc(l.name)}</div><div class="date">${esc(fmtDate(l.net))}</div>
   <div class="status ${st[1]}">${esc(st[0])}</div>
   <div class="meta">${esc(agency)}<br>${esc(rocket)}<br><span class="loc">${esc(loc)}</span></div>${video?`<a class="watch" href="${esc(video)}" target="_blank" rel="noopener"><span class="liveDot"></span> WATCH LAUNCH</a>`:`<a class="watch" href="${esc(fallback)}" target="_blank" rel="noopener">📺 FIND LIVE STREAM</a>`}</div>
   <div class="arrow">›</div></article>`;
 }).join('');
}
function tick(){
 const n=launches[0]; if(!n?.net)return;
 $('nextName').textContent=n.name;
 let d=Math.max(0,new Date(n.net)-new Date());
 const days=Math.floor(d/86400000); d%=86400000;
 const hrs=Math.floor(d/3600000); d%=3600000;
 const mins=Math.floor(d/60000); const secs=Math.floor((d%60000)/1000);
 $('days').textContent=days; $('hours').textContent=String(hrs).padStart(2,'0');
 $('mins').textContent=String(mins).padStart(2,'0'); $('secs').textContent=String(secs).padStart(2,'0');
}
async function load(){
 try{
  const r=await fetch(API); if(!r.ok)throw new Error('API '+r.status);
  const j=await r.json();
  launches=(j.results||[]).filter(florida).sort((a,b)=>new Date(a.net)-new Date(b.net));
  render(); tick(); clearInterval(timer); timer=setInterval(tick,1000);
  $('updated').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 }catch(e){$('list').innerHTML='<div class="error">Could not load launch data. Pull down to refresh and try again.</div>'; console.error(e)}
}
load(); setInterval(load,15*60*1000);
</script>
</body></html>
